# ROS TF-style camera poses in the cam0 rig frame: T_rig_camera.
# Quaternion order is [x, y, z, w]. The wrapper derives COLMAP's inverse
# camera extrinsics internally; do not pre-invert these transforms.
cam0:
  rotation: [0.0, 0.0, 0.0, 1.0]
  translation: [0.0, 0.0, 0.0]

# Replace with the calibrated ROS T_left_right of the stereo rig.
cam1:
  rotation: [0.001381335638, -0.006174988051, -0.002812544932,
             0.999976025225]
  translation: [0.399963167291, -0.002256805786, 0.004936763951]
