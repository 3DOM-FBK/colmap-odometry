# Stereo odometry for the ZED rig of the IDEAL dataset (rectified 16:9 images).
stereo_pairs: [[cam0, cam1]]

features:
  # Half the native rectified resolution, preserving the 16:9 aspect ratio.
  resize: {width: 960, height: 540}
  joint: {name: loma, model: loma_B128, num_keypoints: 1500, filter_threshold: 0.1, compile: false}

stereo:
  epipolar_max_error_px: 2.0
  reprojection_max_error_px: 3.0
  min_triangulation_angle_deg: 0.2
  min_depth: 0.2
  max_depth: 50.0

temporal:
  max_error_px: 2.0
  confidence: 0.999
  max_iterations: 10000

pnp:
  ransac_max_error_px: 3.0

refinement:
  pixel_std_px: 1.0
  robust_delta: 3.0
  max_iterations: 4
  min_points: 6
  spatial_clusters: 24

feature_tracks:
  enabled: true
  min_length: 20
