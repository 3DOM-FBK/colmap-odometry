# Minimal stereo triangulation + PnP profile for the iRobot stereo rig
# (1600x1200 images).
stereo_pairs: [[cam0, cam1]]

features:
  # Aspect-preserving 4:3 resize of the 1600x1200 images.
  resize: {width: 1024, height: 768}
  joint: {name: loma, model: loma_B128, num_keypoints: 1000, filter_threshold: 0.1, compile: false}

stereo:
  epipolar_max_error_px: 2.0
  reprojection_max_error_px: 3.0
  min_triangulation_angle_deg: 0.2
  min_depth: 0.2
  max_depth: 20.0

temporal:
  max_error_px: 2.0
  confidence: 0.999
  max_iterations: 10000

pnp:
  ransac_max_error_px: 3.0

refinement:
  pixel_std_px: 1.0
  robust_delta: 3.0
  max_iterations: 4
  min_points: 6
  spatial_clusters: 24

# Stelvio consumes native tracks produced by the same features and temporal
# matches used by the minimal-solver route. Histories shorter than min_length
# cannot become graph factors (Stelvio admission).
feature_tracks:
  enabled: true
  min_length: 20
