# Minimal stereo triangulation + PnP profile for the TUM-VI dataset.
# Same structure as config_odometry.yaml, tuned for 1024x1024 images at 20 Hz
# and the ~0.10095 m TUM-VI stereo baseline.
general:
  test: false
  log: false
  frames_range: [0, -1]
  save_keyframes: false
  min_solver: true
  # Minimal stereo/PnP odometry uses each synchronized rig pair directly.
  # The COLMAP database is only needed by the legacy reconstruction route.
  process_every_frame: true
  write_colmap_database: false
  feature_track_publish_min_length: 50
  no_stereo_constraint_in_local_ba: false

local_features:
  features_name: loma
  resize_width: 1024
  resize_height: 1024
  superpoint_open:
        top_k: 1000
  aliked:
    model_name: "aliked-n16rot"
    top_k: 2000
    scores_th: 0.1
    n_limit: 1500
  loma:
    model_name: "loma_B128"
    top_k: 1000
    spatial_grid_rows: 3
    spatial_grid_cols: 3
    spatial_candidate_multiplier: 4
    compile: true
    filter_threshold: 0.1
  matcher: loma
  lightglue_filter_threshold: 0.05
  lightglue_depth_confidence: 0.95
  lightglue_width_confidence: 0.99
  ratio_threshold: 0.95

mapping:
  cameras: ["cam0", "cam1"]
  rig_match_rule: [["cam0", "cam1"]]
  cameras_for_baseline_estim: ["cam0", "cam1"]
  # Stereo baseline from the official TUM-VI kalibr calibration (1024).
  baseline: 0.10095
  stereo_epipolar_max_error_px: 2.0
  stereo_reprojection_max_error_px: 3.0
  stereo_min_triangulation_angle_deg: 0.2
  stereo_min_depth: 0.2
  stereo_max_depth: 20.0
  temporal_epipolar_max_error_px: 2.0
  geometric_verification_method: magsac
  magsac_confidence: 0.999
  magsac_max_iterations: 10000
  pnp_ransac_max_error_px: 3.0
  # Per-consecutive-frame structureless stereo refinement. Temporary points
  # are Schur-eliminated immediately; no windowed bundle is used.
  structureless_max_iterations: 4
  structureless_robust_delta_px: 3.0
  sliding_window: 10
  max_match_distance: 1
  max_keyframes: 100000000
  method: "with_pycolmap_reconstruct"
  init_max_forward_motion: 0.99
  init_min_tri_angle: 0.1
  init_max_error: 100.0
  init_min_num_inliers: 30
  abs_pose_max_error: 4.0
  abs_pose_min_num_inliers: 8
  abs_pose_min_inlier_ratio: 0.01
  filter_max_reproj_error: 2.0
  filter_min_tri_angle: 0.0
  local_ba_min_tri_angle: 0.0
  tri_ignore_two_view_tracks: 0

bundle_adjustment:
  max_cost_change_px: 3.0
  refine_focal_length: false
  refine_principal_point: false
  refine_extra_params: false
  global_max_num_iterations: 25
  global_max_refinements: 10

covariance:
  pixel_std_px: 1.0
  min_points: 6
  spatial_clusters: 24
