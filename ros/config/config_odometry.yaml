# Minimal stereo triangulation + PnP profile for a calibrated stereo rig
# (1600x1200 images, ALIKED + LightGLue features).
stereo_pairs: [[cam0, cam1]]

features:
  resize: {width: 1600, height: 1200}
  extractor: {name: aliked, model_name: aliked-n16rot, max_num_keypoints: 1200, detection_threshold: 0.1}
  matcher: {name: lightglue, filter_threshold: 0.05, depth_confidence: 0.95, width_confidence: 0.99}

stereo:
  epipolar_max_error_px: 2.0
  reprojection_max_error_px: 3.0
  min_triangulation_angle_deg: 0.2
  min_depth: 0.5
  max_depth: 20.0

temporal:
  max_error_px: 2.0
  confidence: 0.999
  max_iterations: 10000

pnp:
  ransac_max_error_px: 3.0

refinement:
  pixel_std_px: 1.0
  robust_delta: 3.0
  max_iterations: 4
  min_points: 6
  spatial_clusters: 24

feature_tracks:
  enabled: true
  min_length: 5
